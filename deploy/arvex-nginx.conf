server {
    listen 80;
    listen [::]:80;
    server_name arvex.host www.arvex.host;
    return 301 https://arvex.host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arvex.host www.arvex.host;

    root /var/www/arvex/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/arvex.host/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arvex.host/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Server-side CMS and admin authentication.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /cms-sync.js {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }
}
