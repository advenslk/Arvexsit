name: Auth persistence fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-auth:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch authentication persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/context/AppContext.tsx')
          s = p.read_text()
          replacements = {
              "    setUser(defaultUser);\n    showNotification(`Signed in as ${defaultUser.name} (${role})`);": "    setStored('user', defaultUser);\n    setUser(defaultUser);\n    showNotification(`Signed in as ${defaultUser.name} (${role})`);",
              "    setUser(googleUser);\n    showNotification('Successfully authenticated via Google OAuth!');": "    setStored('user', googleUser);\n    setUser(googleUser);\n    showNotification('Successfully authenticated via Google OAuth!');",
              "    setUser(githubUser);\n    showNotification('Authenticated via GitHub!');": "    setStored('user', githubUser);\n    setUser(githubUser);\n    showNotification('Authenticated via GitHub!');",
              "    setUser(discordUser);\n    showNotification('Connected with Discord ID!');": "    setStored('user', discordUser);\n    setUser(discordUser);\n    showNotification('Connected with Discord ID!');",
              "  const logout = () => {\n    setUser(null);": "  const logout = () => {\n    setStored('user', null);\n    try { localStorage.removeItem('arvex_admin_token'); } catch {}\n    setUser(null);",
              "    setUser(newUser);\n    showNotification(`Account created! Welcome to ArveX, ${name}`);": "    setStored('user', newUser);\n    setUser(newUser);\n    showNotification(`Account created! Welcome to ArveX, ${name}`);",
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/AppContext.tsx
          git diff --cached --quiet || git commit -m "fix auth persistence across refresh"
          git push
