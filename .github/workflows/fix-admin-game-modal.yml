name: Fix Admin Games Catalog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Games Catalog editor modal
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/AdminPanelModal.tsx')
          text = path.read_text(encoding='utf-8')
          marker = '        {/* Bottom Bar in Admin */}'

          if 'MODAL: ADD / EDIT GAME' in text:
              print('Games editor modal already present; nothing to do.')
              raise SystemExit(0)

          modal = r'''        {/* MODAL: ADD / EDIT GAME */}
          {(editingGame || isAddingGame) && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/85 backdrop-blur-sm animate-in fade-in">
              <div className="w-full max-w-lg rounded-3xl bg-[#11141e] border border-cyan-500/30 p-6 shadow-2xl space-y-4 text-xs max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-3 border-b border-white/10">
                  <div className="flex items-center gap-3">
                    <div className="w-9 h-9 rounded-xl bg-cyan-500/15 text-cyan-400 flex items-center justify-center">
                      <Gamepad2 className="w-4 h-4" />
                    </div>
                    <div>
                      <h3 className="text-sm font-bold text-white">
                        {isAddingGame ? 'Add New Game' : `Edit Game: ${editingGame?.name}`}
                      </h3>
                      <p className="text-[11px] text-slate-400">Configure the game shown in the public Games Catalog.</p>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => { setEditingGame(null); setIsAddingGame(false); }}
                    className="p-1.5 rounded-lg bg-white/5 text-slate-400 hover:text-white"
                    title="Close"
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Game Name</label>
                    <input
                      type="text"
                      defaultValue={editingGame?.name || ''}
                      id="form-game-name"
                      placeholder="e.g. Minecraft"
                      className="w-full bg-[#0a0c12] border border-white/10 rounded-xl px-3 py-2 text-white outline-none focus:border-cyan-500/50"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Category</label>
                    <input
                      type="text"
                      defaultValue={editingGame?.category || 'Sandbox & Survival'}
                      id="form-game-category"
                      placeholder="e.g. Action & Survival"
                      className="w-full bg-[#0a0c12] border border-white/10 rounded-xl px-3 py-2 text-white outline-none focus:border-cyan-500/50"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Starting Price ($/mo)</label>
                    <input
                      type="number"
                      min="0"
                      step="0.01"
                      defaultValue={editingGame?.startingPrice ?? 5}
                      id="form-game-price"
                      className="w-full bg-[#0a0c12] border border-white/10 rounded-xl px-3 py-2 text-white outline-none focus:border-cyan-500/50"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Status</label>
                    <select
                      id="form-game-status"
                      defaultValue={editingGame?.status || 'active'}
                      className="w-full bg-[#0a0c12] border border-white/10 rounded-xl px-3 py-2 text-white outline-none"
                    >
                      <option value="active">Active</option>
                      <option value="maintenance">Maintenance</option>
                      <option value="hidden">Hidden</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-slate-300 font-semibold mb-1">Cover Image URL</label>
                  <input
                    type="url"
                    defaultValue={editingGame?.image || ''}
                    id="form-game-image"
                    placeholder="https://.../game-cover.jpg"
                    className="w-full bg-[#0a0c12] border border-white/10 rounded-xl px-3 py-2 text-white text-xs outline-none focus:border-cyan-500/50"
                  />
                </div>

                <div>
                  <label className="block text-slate-300 font-semibold mb-1">Banner Image URL (Optional)</label>
                  <input
                    type="url"
                    defaultValue={editingGame?.bannerImage || ''}
                    id="form-game-banner"
                    placeholder="https://.../game-banner.jpg"
                    className="w-full bg-[#0a0c12] border border-white/10 rounded-xl px-3 py-2 text-white text-xs outline-none focus:border-cyan-500/50"
                  />
                </div>

                <div>
                  <label className="block text-slate-300 font-semibold mb-1">Short Description</label>
                  <textarea
                    rows={2}
                    defaultValue={editingGame?.shortDescription || editingGame?.description || ''}
                    id="form-game-description"
                    placeholder="Short description shown with the game."
                    className="w-full bg-[#0a0c12] border border-white/10 rounded-xl px-3 py-2 text-white outline-none focus:border-cyan-500/50"
                  />
                </div>

                <div className="flex items-center gap-2">
                  <input
                    type="checkbox"
                    defaultChecked={editingGame?.popular ?? false}
                    id="form-game-popular"
                    className="rounded bg-[#0a0c12] border-white/10"
                  />
                  <label htmlFor="form-game-popular" className="text-slate-300 font-semibold">Mark as Popular</label>
                </div>

                <div className="flex justify-end gap-2 pt-4 border-t border-white/10">
                  <button
                    type="button"
                    onClick={() => { setEditingGame(null); setIsAddingGame(false); }}
                    className="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      const name = (document.getElementById('form-game-name') as HTMLInputElement).value.trim();
                      if (!name) {
                        alert('Please enter a game name');
                        return;
                      }
                      const category = (document.getElementById('form-game-category') as HTMLInputElement).value.trim() || 'Game Hosting';
                      const startingPrice = Number((document.getElementById('form-game-price') as HTMLInputElement).value);
                      const image = (document.getElementById('form-game-image') as HTMLInputElement).value.trim();
                      const bannerImage = (document.getElementById('form-game-banner') as HTMLInputElement).value.trim();
                      const description = (document.getElementById('form-game-description') as HTMLTextAreaElement).value.trim();
                      const status = (document.getElementById('form-game-status') as HTMLSelectElement).value as GameItem['status'];
                      const popular = (document.getElementById('form-game-popular') as HTMLInputElement).checked;
                      const slug = name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

                      if (!Number.isFinite(startingPrice) || startingPrice < 0) {
                        alert('Please enter a valid starting price');
                        return;
                      }
                      if (!image) {
                        alert('Please enter a cover image URL');
                        return;
                      }

                      if (isAddingGame) {
                        addGame({
                          name,
                          slug,
                          category,
                          startingPrice,
                          image,
                          bannerImage: bannerImage || undefined,
                          description: description || undefined,
                          shortDescription: description || undefined,
                          popular,
                          status,
                        });
                        showSaveToast('New game added to the Games Catalog!');
                      } else if (editingGame) {
                        updateGame(editingGame.id, {
                          name,
                          slug,
                          category,
                          startingPrice,
                          image,
                          bannerImage: bannerImage || undefined,
                          description: description || undefined,
                          shortDescription: description || undefined,
                          popular,
                          status,
                        });
                        showSaveToast('Game updated successfully!');
                      }
                      setEditingGame(null);
                      setIsAddingGame(false);
                    }}
                    className="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black font-bold"
                  >
                    {isAddingGame ? 'Add Game' : 'Save Game'}
                  </button>
                </div>
              </div>
            </div>
          )}

'''

          if marker not in text:
              raise SystemExit('Could not find AdminPanelModal bottom-bar insertion marker')

          path.write_text(text.replace(marker, modal + marker, 1), encoding='utf-8')
          print('Inserted Games Catalog editor modal.')

      - name: Commit patched component
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminPanelModal.tsx .github/workflows/fix-admin-game-modal.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(admin): make Games Catalog add and edit controls functional"
          git push